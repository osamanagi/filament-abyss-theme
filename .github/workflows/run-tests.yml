name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.2]
        filament: [4, 5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 8.2
            laravel: 13.*
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - F${{ matrix.filament }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: ${{ runner.os == 'Linux' && matrix.php == '8.3' && matrix.stability == 'prefer-stable' && 'pcov' || 'none' }}

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "filament/filament:~${{ matrix.filament }}.0" "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Check PHP coverage
        if: runner.os == 'Linux' && matrix.php == '8.3' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --ci --coverage --min=95

      - name: Set up Node.js
        if: runner.os == 'Linux' && matrix.php == '8.3' && matrix.stability == 'prefer-stable'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Compile the theme against Filament
        if: runner.os == 'Linux' && matrix.php == '8.3' && matrix.stability == 'prefer-stable'
        run: |
          npm install --no-save --no-audit --no-fund @tailwindcss/cli@4.1.18 tailwindcss@4.1.18
          mkdir -p vendor/osamanagi/filament-abyss-theme/resources/css build
          cp resources/css/theme.css vendor/osamanagi/filament-abyss-theme/resources/css/theme.css
          ./node_modules/.bin/tailwindcss -i vendor/osamanagi/filament-abyss-theme/resources/css/theme.css -o build/theme.css
          grep -Fq -- '--primary-500: #2b9c9a;' build/theme.css
